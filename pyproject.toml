[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbrain-handoffs"
version = "0.1.0"
description = "Exact, durable handoffs between AI coding agents."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "KE Studios"}]
keywords = ["agents", "handoffs", "mcp", "codex", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
# Standard library only: no install-time dependencies.

[project.urls]
Homepage = "https://github.com/willykeenan/agentbrain-handoffs"
Repository = "https://github.com/willykeenan/agentbrain-handoffs"
"Hugging Face" = "https://huggingface.co/spaces/willykeenan/agentbrain-handoffs"
Issues = "https://github.com/willykeenan/agentbrain-handoffs/issues"

[project.scripts]
handoffs = "agentbrain_handoffs.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentbrain_handoffs = ["page.html"]
